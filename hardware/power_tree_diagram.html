<title>5-Channel Wireless EMG — Power Tree &amp; Placement</title>

<h2>1 · Power Tree — signal flow</h2>
<div class="sub">STM32U575 + ST67W611M1-B &nbsp;|&nbsp; Li-Po 1000 mAh → buck-boost 3.5 V → LDO 3.3 V analog</div>

<svg width="1400" height="620" viewBox="0 0 1400 620">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#6b7280"/>
    </marker>
  </defs>
  <style>
    .box{rx:9;stroke-width:2}
    .t{font-size:13.5px;font-weight:700;fill:#111827}
    .d{font-size:11px;fill:#4b5563}
    .p{font-size:10.5px;fill:#9ca3af;font-style:italic}
    .w{stroke:#6b7280;stroke-width:2;fill:none;marker-end:url(#a)}
    .nl{font-size:11px;font-weight:700}
  </style>

  <!-- USB-C -->
  <rect x="25" y="80" width="195" height="98" class="box" fill="#fff7ed" stroke="#ea580c"/>
  <text x="122" y="103" class="t" text-anchor="middle">USB-C  (charge only)</text>
  <text x="38" y="123" class="d">VBUS 5 V · 16-pin mid-mount</text>
  <text x="38" y="140" class="d">CC1,CC2 → 5.1 kΩ → GND</text>
  <text x="38" y="157" class="d">TVS SMAJ5.0A + 10 µF</text>
  <text x="38" y="172" class="p">D+/D− optional → STM32 USB</text>

  <!-- Li-Po -->
  <rect x="25" y="300" width="195" height="88" class="box" fill="#fff7ed" stroke="#ea580c"/>
  <text x="122" y="323" class="t" text-anchor="middle">Li-Po cell</text>
  <text x="38" y="343" class="d">3.7 V · 1000 mAh · JST-PH</text>
  <text x="38" y="360" class="d">integrated PCM required</text>
  <text x="38" y="378" class="p">2000 mAh = full-day option</text>

  <!-- Charger -->
  <rect x="272" y="80" width="212" height="98" class="box" fill="#fef2f2" stroke="#dc2626"/>
  <text x="378" y="103" class="t" text-anchor="middle">MCP73831  charger</text>
  <text x="285" y="123" class="d">SOT-23-5 · linear, 1-cell</text>
  <text x="285" y="140" class="d"><tspan font-weight="700">R_PROG = 2.0 kΩ → 500 mA</tspan></text>
  <text x="285" y="157" class="d">STAT → LED + 1 kΩ</text>
  <text x="285" y="172" class="p">4.7 µF in · 4.7 µF out</text>

  <!-- Rev pol -->
  <rect x="272" y="300" width="212" height="88" class="box" fill="#fef2f2" stroke="#dc2626"/>
  <text x="378" y="323" class="t" text-anchor="middle">Q_RP  reverse-polarity</text>
  <text x="285" y="343" class="d">P-MOS DMG3415U (SOT-23)</text>
  <text x="285" y="360" class="d">source=batt, drain=VBAT</text>
  <text x="285" y="378" class="p">gate → GND (blocks reversed cell)</text>

  <!-- Mux -->
  <rect x="545" y="150" width="205" height="105" class="box" fill="#f0fdfa" stroke="#0d9488"/>
  <text x="647" y="173" class="t" text-anchor="middle">TPS2116  power mux</text>
  <text x="558" y="193" class="d">VSSOP-8 · 1.6–5.5 V</text>
  <text x="558" y="210" class="d">IN1 = VBUS (priority)</text>
  <text x="558" y="227" class="d">IN2 = VBAT → OUT = VSYS</text>
  <text x="558" y="246" class="p">glitch-free switchover · 1 µF</text>

  <!-- Fuel gauge -->
  <rect x="545" y="330" width="205" height="98" class="box" fill="#faf5ff" stroke="#9333ea"/>
  <text x="647" y="353" class="t" text-anchor="middle">MAX17048  fuel gauge</text>
  <text x="558" y="373" class="d">µDFN-8 · on VBAT node</text>
  <text x="558" y="390" class="d">I²C @ 0x36 → STM32</text>
  <text x="558" y="407" class="d">ALRT → GPIO (low-batt)</text>
  <text x="558" y="423" class="p">23 µA · 1 µF · 4.7 kΩ ×2 pull-ups</text>

  <!-- Buck-boost -->
  <rect x="800" y="80" width="215" height="112" class="box" fill="#eff6ff" stroke="#2563eb"/>
  <text x="907" y="103" class="t" text-anchor="middle">TPS631000  buck-boost</text>
  <text x="813" y="123" class="d">SOT-583 · 2 MHz · Iq 8 µA</text>
  <text x="813" y="140" class="d"><tspan font-weight="700">V_OUT = 3.5 V</tspan>  (V_FB = 0.5 V)</text>
  <text x="813" y="157" class="d">R1 604 kΩ / R2 100 kΩ</text>
  <text x="813" y="174" class="p">L 1 µH shielded · 10 µF in · 22 µF out</text>
  <text x="813" y="188" class="p">[confirm 3 passives from datasheet]</text>

  <!-- LDO -->
  <rect x="800" y="330" width="215" height="105" class="box" fill="#ecfdf5" stroke="#059669"/>
  <text x="907" y="353" class="t" text-anchor="middle">TPS7A2033  analog LDO</text>
  <text x="813" y="373" class="d">SOT-23-5 · fixed <tspan font-weight="700">3.3 V</tspan></text>
  <text x="813" y="390" class="d">7 µVrms · 95 dB PSRR @1 kHz</text>
  <text x="813" y="407" class="d">Iq 6.5 µA · no NR cap needed</text>
  <text x="813" y="426" class="p">1 µF in · 1 µF + 10 µF out</text>

  <!-- Digital loads -->
  <rect x="1120" y="80" width="250" height="112" class="box" fill="#eff6ff" stroke="#2563eb"/>
  <text x="1245" y="103" class="t" text-anchor="middle">3V3_DIG loads (3.5 V)</text>
  <text x="1133" y="124" class="d">STM32U575 — VDD</text>
  <text x="1133" y="143" class="d">ST67W611M1-B — VDD33, VDDIO</text>
  <text x="1133" y="162" class="p">10 µF per ST67 pin, own via</text>
  <text x="1133" y="180" class="p">100 nF per STM32 VDD pin</text>

  <!-- Analog loads -->
  <rect x="1120" y="330" width="250" height="105" class="box" fill="#ecfdf5" stroke="#059669"/>
  <text x="1245" y="353" class="t" text-anchor="middle">3V3_ANA loads (3.3 V)</text>
  <text x="1133" y="374" class="d">5 × electrode boards (FFC p10)</text>
  <text x="1133" y="393" class="d">5 × AD8237 + 3 × MCP6404</text>
  <text x="1133" y="412" class="d">STM32 VDDA / VREF+</text>
  <text x="1133" y="429" class="p">ratiometric ADC · quiet rail</text>

  <!-- wires -->
  <path class="w" d="M220,124 L272,124"/>
  <path class="w" d="M220,344 L272,344"/>
  <!-- VBUS over the top to mux IN1 -->
  <path class="w" d="M220,96 L246,96 L246,58 L516,58 L516,180 L545,180"/>
  <text x="330" y="50" class="nl" fill="#7c3aed">VBUS 5 V</text>
  <!-- charger out + battery meet at VBAT -->
  <path d="M484,140 L516,140 L516,225" stroke="#dc2626" stroke-width="2" fill="none"/>
  <path d="M484,344 L516,344 L516,225" stroke="#dc2626" stroke-width="2" fill="none"/>
  <path class="w" d="M516,225 L545,225"/>
  <circle cx="516" cy="225" r="4" fill="#dc2626"/>
  <text x="452" y="252" class="nl" fill="#dc2626">VBAT</text>
  <!-- VBAT down to gauge -->
  <path class="w" d="M516,225 L516,379 L545,379"/>
  <!-- mux -> buck -->
  <path class="w" d="M750,202 L772,202 L772,136 L800,136"/>
  <text x="756" y="290" class="nl" fill="#0d9488">VSYS 3.0–5.0 V</text>
  <!-- buck -> digital rail -->
  <path d="M1015,136 L1370,136" stroke="#2563eb" stroke-width="3.5" fill="none"/>
  <text x="1030" y="126" class="nl" fill="#2563eb">3V3_DIG 3.5 V</text>
  <!-- drop to LDO -->
  <path class="w" d="M1068,136 L1068,290 L907,290 L907,330"/>
  <circle cx="1068" cy="136" r="4" fill="#2563eb"/>
  <!-- LDO -> analog loads -->
  <path class="w" d="M1015,382 L1120,382"/>
  <text x="1022" y="372" class="nl" fill="#059669">3V3_ANA 3.3 V</text>
  <!-- USB detect -->
  <path d="M246,96 L246,470 L640,470" stroke="#7c3aed" stroke-width="1.6" fill="none" stroke-dasharray="5,4" marker-end="url(#a)"/>
  <text x="252" y="488" class="d" fill="#7c3aed">USB_DET: VBUS → 200 kΩ/100 kΩ divider → STM32 ADC — firmware disables acquisition while USB is connected</text>

  <!-- legend -->
  <rect x="25" y="520" width="1345" height="76" rx="8" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="40" y="543" class="t">Why 3.5 V digital?</text>
  <text x="40" y="563" class="d">The electrodes need a clean <tspan font-weight="700">3.3 V</tspan>, and the TPS7A20 needs ≥140 mV to regulate. Running the buck-boost at <tspan font-weight="700">3.5 V</tspan> gives the LDO ~200 mV headroom <tspan font-weight="700">across the whole battery discharge</tspan> (its output is regulated regardless of cell voltage),</text>
  <text x="40" y="581" class="d">which removes the end-of-discharge dropout problem. 3.5 V is in spec for both digital parts (STM32U575 ≤ 3.6 V; ST67 2.97–3.63 V).</text>
</svg>

<h2>2 · Where to place it on the PCB</h2>
<div class="sub">Power is the "dirty" corner — diagonally opposite the analog island and away from the antenna</div>

<svg width="1400" height="470" viewBox="0 0 1400 470">
  <style>
    .z{rx:8;stroke-width:2}
    .zt{font-size:14px;font-weight:700}
    .zd{font-size:11.5px;fill:#4b5563}
  </style>

  <rect x="40" y="30" width="1000" height="400" fill="#fcfcfd" stroke="#374151" stroke-width="2.5" rx="6"/>

  <!-- RF -->
  <rect x="60" y="50" width="250" height="150" class="z" fill="#fef2f2" stroke="#dc2626" stroke-dasharray="6,4"/>
  <text x="185" y="75" class="zt" fill="#dc2626" text-anchor="middle">RF ZONE</text>
  <text x="75" y="97" class="zd">ST67W611M1-B in the corner</text>
  <text x="75" y="115" class="zd">antenna faces off-board ↖</text>
  <text x="75" y="133" class="zd">ALL-LAYER keep-out:</text>
  <text x="75" y="151" class="zd">no copper / traces / vias / parts</text>
  <text x="75" y="175" class="zd" font-style="italic">far from power + battery metal</text>

  <!-- Digital -->
  <rect x="330" y="50" width="290" height="150" class="z" fill="#eff6ff" stroke="#2563eb"/>
  <text x="475" y="75" class="zt" fill="#2563eb" text-anchor="middle">DIGITAL ZONE</text>
  <text x="345" y="97" class="zd">STM32U575</text>
  <text x="345" y="115" class="zd">ADC pins face DOWN (to analog)</text>
  <text x="345" y="133" class="zd">SPI pins face LEFT (to ST67), short</text>
  <text x="345" y="151" class="zd">SWD + ST67 UART/BOOT pads</text>
  <text x="345" y="175" class="zd" font-style="italic">100 nF per VDD pin, via-in-pad</text>

  <!-- Power -->
  <rect x="640" y="50" width="380" height="150" class="z" fill="#faf5ff" stroke="#9333ea"/>
  <text x="830" y="75" class="zt" fill="#9333ea" text-anchor="middle">POWER ZONE  (dirty)</text>
  <text x="655" y="97" class="zd">USB-C at the board edge → TVS → MCP73831</text>
  <text x="655" y="115" class="zd">TPS2116 mux · Q_RP · then TPS631000</text>
  <text x="655" y="133" class="zd" font-weight="700" fill="#7c2d12">buck switch loop TINY: Cin → IC → L → Cout</text>
  <text x="655" y="151" class="zd">shielded 1 µH inductor · copper pour for charger heat</text>
  <text x="655" y="175" class="zd" font-style="italic">diagonally FAR from the AFE and the antenna</text>

  <!-- Analog -->
  <rect x="60" y="225" width="700" height="185" class="z" fill="#ecfdf5" stroke="#059669"/>
  <text x="410" y="250" class="zt" fill="#059669" text-anchor="middle">ANALOG QUIET ISLAND</text>
  <text x="78" y="274" class="zd">Each FFC sits at the bottom edge, directly in front of ITS OWN AD8237 → servo → gain (keep each channel's parts together)</text>
  <text x="78" y="294" class="zd">VREF divider + the two VREF buffers central to the island · J_REF (reference electrode) at the edge</text>
  <text x="78" y="314" class="zd" font-weight="700" fill="#065f46">★ TPS7A2033 LDO GOES HERE — not in the power zone. It is the analog rail's source / power fence.</text>
  <text x="78" y="334" class="zd" font-style="italic">guard ring around each AD8237 input pair · no digital or power trace may cross this island</text>
  <rect x="90" y="352" width="105" height="40" rx="4" fill="#fff" stroke="#059669"/><text x="142" y="377" class="zd" text-anchor="middle">FFC ch1</text>
  <rect x="215" y="352" width="105" height="40" rx="4" fill="#fff" stroke="#059669"/><text x="267" y="377" class="zd" text-anchor="middle">FFC ch2</text>
  <rect x="340" y="352" width="105" height="40" rx="4" fill="#fff" stroke="#059669"/><text x="392" y="377" class="zd" text-anchor="middle">FFC ch3</text>
  <rect x="465" y="352" width="105" height="40" rx="4" fill="#fff" stroke="#059669"/><text x="517" y="377" class="zd" text-anchor="middle">FFC ch4</text>
  <rect x="590" y="352" width="105" height="40" rx="4" fill="#fff" stroke="#059669"/><text x="642" y="377" class="zd" text-anchor="middle">FFC ch5</text>

  <!-- Battery -->
  <rect x="780" y="225" width="240" height="185" class="z" fill="#fff7ed" stroke="#ea580c"/>
  <text x="900" y="250" class="zt" fill="#ea580c" text-anchor="middle">BATTERY ZONE</text>
  <text x="795" y="274" class="zd">Li-Po pouch (under or beside)</text>
  <text x="795" y="292" class="zd">JST-PH at the edge</text>
  <text x="795" y="310" class="zd">MAX17048 next to the connector</text>
  <text x="795" y="334" class="zd" font-style="italic">keep battery metal off the</text>
  <text x="795" y="352" class="zd" font-style="italic">antenna diagonal</text>

  <text x="540" y="452" font-size="13" font-weight="700" fill="#374151" text-anchor="middle">L2 = ONE SOLID GROUND PLANE under everything — no splits. Separation comes from PLACEMENT, not copper cuts.</text>

  <!-- side notes -->
  <rect x="1060" y="30" width="315" height="400" rx="8" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="1078" y="56" class="zt" fill="#b45309">Placement order</text>
  <text x="1078" y="82" class="zd">1. ST67 + antenna keep-out (corner)</text>
  <text x="1078" y="102" class="zd">2. 5× FFC along the bottom edge</text>
  <text x="1078" y="122" class="zd">3. AD8237 behind each FFC</text>
  <text x="1078" y="142" class="zd">4. servo + gain behind each AD8237</text>
  <text x="1078" y="162" class="zd">5. VREF divider + 2 buffers (centre)</text>
  <text x="1078" y="182" class="zd">6. LDO inside the analog island</text>
  <text x="1078" y="202" class="zd">7. STM32 (ADC side down)</text>
  <text x="1078" y="222" class="zd">8. buck-boost + tight switch loop</text>
  <text x="1078" y="242" class="zd">9. charger + USB-C at the edge</text>
  <text x="1078" y="262" class="zd">10. battery + fuel gauge</text>
  <text x="1078" y="282" class="zd">11. pour GND, stitch vias everywhere</text>

  <text x="1078" y="320" class="zt" fill="#b45309">Golden rules</text>
  <text x="1078" y="344" class="zd">• Power ↔ analog = maximum diagonal</text>
  <text x="1078" y="364" class="zd">• No analog trace over digital/RF/power</text>
  <text x="1078" y="384" class="zd">• Antenna keep-out on EVERY layer</text>
  <text x="1078" y="404" class="zd">• LDO with the AFE, buck with the dirt</text>
</svg>
